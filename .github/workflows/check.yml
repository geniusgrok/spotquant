name: Check
on:
  push:
    branches: [main]
    paths:
      - 'spotquant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/**'
      - 'evidence/**'
      - '.github/workflows/check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spotquant/**'
      - 'tests/**'
      - 'main.py'
      - 'config.example.json'
      - 'research/**'
      - 'evidence/**'
      - '.github/workflows/check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spotquant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Compile and run offline checks
        run: |
          python -m compileall -q spotquant research tests
          python -m unittest discover -s tests -v
